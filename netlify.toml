# Grand Prix CRM — Netlify build configuration (primary deploy target).
#
# Netlify auto-detects the Next.js runtime (no plugin needed). The build
# script resolves the Postgres connection string (Netlify DB via
# NETLIFY_DB_URL, or a standard DATABASE_URL), runs pending Prisma
# migrations BEFORE `npm run build` so the schema is always current.
#
# Only ONE env var is strictly required: BETTER_AUTH_SECRET.
# APP_URL defaults to Netlify's own site URL — set it explicitly only when
# pointing a custom domain (e.g. https://app.grandprixdynamics.com).
# See .env.example and DEPLOY.md for the full table.

[build]
  command = "./scripts/netlify-build.sh"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
